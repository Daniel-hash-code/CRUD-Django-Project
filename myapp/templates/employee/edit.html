{% load static %}

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Edit Employee | Employee Management</title>

    <link rel="stylesheet" href="{% static 'css/style.css' %}" />
  </head>

  <body>
    <main class="container">
      <header class="page-header">
        <h1>Edit Employee</h1>
        <p>Update the employee's information below.</p>
      </header>

      <section class="card employee-form">
        <form method="POST" action="{% url 'update' employee.id %}">
          {% csrf_token %} {{ form.as_p }}

          <button type="submit" class="btn btn-primary">Save Changes</button>

          <a href="{% url 'show' %}" class="btn btn-secondary"> Cancel </a>
        </form>
      </section>
    </main>
  </body>
</html>
