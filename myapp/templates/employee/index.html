{% load static %}

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Add Employee | Employee Management</title>

    <link rel="stylesheet" href="{% static 'css/style.css' %}" />
  </head>

  <body>
    <main class="container">
      <header class="page-header">
        <h1>Add New Employee</h1>
        <p>Enter the employee's details to create a new record.</p>
      </header>

      <section class="card employee-form">
        <form method="POST" action="{% url 'createEmp' %}">
          {% csrf_token %} {{ form.as_p }}

          <button type="submit" class="btn btn-primary">Add Employee</button>
        </form>

        <div class="navigation">
          <a href="{% url 'show' %}" class="btn btn-secondary">
            View Employee Records
          </a>
        </div>
      </section>
    </main>
  </body>
</html>
